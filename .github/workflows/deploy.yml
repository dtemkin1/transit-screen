name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run worker:check

      - run: npm test

      - name: Check WORKER_URL
        run: test -n "$WORKER_URL" || { echo "::error::repo variable WORKER_URL is not set"; exit 1; }
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}

      - name: Build
        run: npm run build
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          ADOBE_FONTS_KIT: ${{ vars.ADOBE_FONTS_KIT }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
