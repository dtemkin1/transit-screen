name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm test

      - run: npm ci
        working-directory: worker

      - run: npm run check
        working-directory: worker

      - run: npm test
        working-directory: worker

      - name: Check WORKER_URL
        run: test -n "$VITE_WORKER_URL" || { echo "::error::repo variable WORKER_URL is not set"; exit 1; }
        env:
          VITE_WORKER_URL: ${{ vars.WORKER_URL }}

      - name: Build
        run: npm run build
        env:
          VITE_WORKER_URL: ${{ vars.WORKER_URL }}
          VITE_ADOBE_FONTS_KIT: ${{ vars.ADOBE_FONTS_KIT }}

      - name: Check feed names
        run: npm run --silent scan-names > dist/names.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
